<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous" />
  <link rel="stylesheet" href="./style/navbar.css" />
  <link rel="stylesheet" href="./style/footer.css" />
  <link rel="icon" type="image/x-icon" href="images/logo_mini.png" />

  <title>Order Confirmation</title>
  
  <style>
    .order-success-container {
      text-align: center;
      padding: 50px 20px;
    }
    
    .success-icon {
      font-size: 80px;
      color: #28a745;
      margin-bottom: 20px;
    }
    
    .order-details {
      max-width: 600px;
      margin: 0 auto;
      background-color: #f8f9fa;
      border-radius: 8px;
      padding: 20px;
      margin-top: 30px;
      text-align: left;
    }
    
    .order-details h4 {
      border-bottom: 1px solid #dee2e6;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    
    .order-item {
      display: flex;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e9ecef;
    }
    
    .order-item-image {
      width: 60px;
      height: 60px;
      border-radius: 4px;
      object-fit: cover;
      margin-right: 15px;
    }
    
    .order-item-details {
      flex-grow: 1;
    }
    
    .order-item-name {
      font-weight: 500;
      margin-bottom: 5px;
    }
    
    .order-item-price {
      color: #6c757d;
      font-size: 14px;
    }
    
    .order-item-quantity {
      color: #6c757d;
      font-size: 14px;
    }
    
    .order-summary {
      margin-top: 20px;
    }
    
    .action-buttons {
      margin-top: 30px;
    }
    
    .action-buttons .btn {
      margin: 0 10px;
    }
  </style>
</head>

<body>
  <!-- Navigation Bar Container -->
  <div id="navbar-container"></div>

  <!-- Main Section -->
  <div class="container my-5">
    <div class="order-success-container">
      <div class="success-icon">
        <i class="fas fa-check-circle"></i>
      </div>
      <h2>Thank You for Your Order!</h2>
      <p class="lead">Your order has been placed successfully.</p>
      <p id="order-id">Order ID: <span id="order-id-value">Loading...</span></p>
      <p>A confirmation email has been sent to your registered email address.</p>
      
      <div class="order-details" id="order-details">
        <h4>Order Details</h4>
        <div id="order-items">
          <!-- Order items will be loaded here -->
          <p class="text-center">Loading order details...</p>
        </div>
        
        <div class="order-summary" id="order-summary">
          <!-- Order summary will be loaded here -->
        </div>
      </div>
      
      <div class="action-buttons">
        <a href="index.html" class="btn btn-primary">Continue Shopping</a>
        <a href="#" id="track-order-btn" class="btn btn-outline-secondary">Track Order</a>
      </div>
    </div>
  </div>

  <!-- Footer Container -->
  <div id="footer-container"></div>

  <!-- Bootstrap and other scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
  <script src="https://kit.fontawesome.com/e5a9c90922.js" crossorigin="anonymous"></script>
  <script src="./scripts/components.js"></script>
  <script src="./scripts/order-success.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous" />
    <link rel="stylesheet" href="./style/navbar.css" />
    <link rel="stylesheet" href="./style/cart.css" />
    <link rel="stylesheet" href="./style/footer.css" />
    <link rel="icon" type="image/x-icon" href="images/logo_mini.png" />

  <title>Your Shopping Cart</title>
</head>

<body>
  <!-- Navigation Bar Container -->
  <div id="navbar-container"></div>
  <!-- ==========================main--section==================== -->
  <div class="container my-5">
    <div class="row">
      <div class="col-12 mb-4 d-flex justify-content-between align-items-center">
        <h2 class="fw-bold">Your Cart</h2>
        <a href="index.html" class="btn btn-outline-secondary">Continue Shopping</a>
      </div>
    </div>

    <div class="row">
      <!-- Left Side: Cart Items Section -->
      <div class="col-lg-8 col-md-7">
        <div id="cart-content" class="row"></div>
      </div>

      <!-- Right Side: Coupon and Totals (Fixed while scrolling) -->
      <div class="col-lg-4 col-md-5" id="left-side-div">
        <div id="cart-sidebar" class="position-sticky" style="top: 20px;">
          <!-- Coupon Section -->
          <div class="mb-4" id="coupon-section">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">Apply Coupon</h5>
                <div class="input-group mb-3">
                  <input type="text" class="form-control" id="coupon-code" placeholder="Enter coupon code">
                  <button class="btn" type="button" id="apply-coupon-btn">Apply</button>
                </div>
                <div id="coupon-message"></div>
                <div id="applied-coupon" class="mt-2"></div>
              </div>
            </div>
          </div>

          <!-- Cart Totals Section -->
          <div id="cart-totals"></div>

          <!-- Checkout Button -->
          <div class="mt-4">
            <button id="checkout-btn" class="btn btn-lg w-100">Checkout</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Container -->
  <div id="footer-container"></div>
</body>

</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
<script src="https://kit.fontawesome.com/e5a9c90922.js" crossorigin="anonymous"></script>
<script src="./scripts/components.js"></script>
<script src="./scripts/cart.js"></script>

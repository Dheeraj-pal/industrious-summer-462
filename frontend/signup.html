<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up</title>
    <link rel="icon" type="image/x-icon" href="images/logo_mini.png" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="./style/signup.css" />
  </head>
  <body>
    <div id="main">
      <div id="image">
        <img src="./images/logo.png" />
      </div>
      <div id="content">
        <h1>Create your free account</h1>
        <form>
          <div id="inpfirstname">
            <label>First Name</label> <br />
            <input id="firstName" type="text" placeholder="Enter your first name" required />
          </div>
          <div id="inplastname">
            <label>Last Name</label> <br />
            <input id="lastName" type="text" placeholder="Enter your last name" required />
          </div>
          <div id="inpemail">
            <label>Email</label><br />
            <input id="email" type="email" placeholder="Enter your email" required />
          </div>
          <div id="inppass">
            <label>Password</label><br />
            <input id="password" type="password" placeholder="Enter your password" required />
          </div>
          <div id="inpphone">
            <label>Phone</label><br />
            <input id="phone" type="tel" placeholder="Enter your phone number" required />
          </div>
          <div id="up">
            <button class="btn" type="submit">SIGN UP</button>
          </div>
          <div id="google">
            <button id="googlebtn" type="button">
              <img src="./images/google-logo.png" alt="" />CONTINUE WITH GOOGLE
            </button>
            <p>Continue with Apple ID</p>
          </div>
        </form>
        <p>
          By creating an account, you agree to the Terms of Service and Privacy
          Policy.
        </p>
        <p>Already have an account? <a href="login.html">Sign in</a></p>
      </div>
      <div id="banner">
        <span class="material-symbols-outlined"> auto_awesome </span>
        <p>Sign up today and get welcome coupon</p>
      </div>
    </div>
  </body>
</html>
<script src="./scripts/signup.js"></script>
<script
  src="https://code.jquery.com/jquery-3.6.1.min.js"
  integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ="
  crossorigin="anonymous"
></script>
<script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>

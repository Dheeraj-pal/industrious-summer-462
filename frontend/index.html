<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous" />
  <link rel="icon" type="image/x-icon" href="images/logo_mini.png" />
  <title>Dollar Store | Save time. Save money. Every day.</title>
  <link rel="stylesheet" href="style/index.css" />
  <script src="scripts/components.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css"
    integrity="sha512-tS3S5qG0BlhnQROyJXvNjeEM4UpMXHrQfTGmbQ1gKmelCxlSEBUaxhRBj/EFTzpbP4RVSrpEikbmdJobCvhE3g=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css"
    integrity="sha512-sMXtMNL1zRzolHYKEujM2AqCLUR9F2C4/05cdbxjjLSRvMQIciEPCQZo++nk7go3BtSuK9kfa/s+a4f4i5pLkw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./style/navbar.css" />
  <link rel="stylesheet" href="./style/footer.css" />
</head>

<body>

  <!-- Navigation Bar Container -->
  <div id="navbar-container"></div>

  <!-- Loading Spinner -->
  <div id="loading" class="loading-spinner">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Error Message -->
  <div id="error-message" class="error-message d-none">
    <img src="./images/404.svg" width="300px" alt="not_found">
    <h3>Oops! Something went wrong</h3>
    <p>Please try refreshing the page or contact support if the problem persists.</p>
    <button class="btn btn-primary" onclick="loadHomeData()">Retry</button>
  </div>

  <!-- Dynamic Content Container -->
  <div id="dynamic-content" class="d-none">
    <!-- Content will be dynamically populated here -->
  </div>

  <!-- Footer Container -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.3/jquery.min.js"
    integrity="sha512-STof4xm1wgkfm7heWqFJVn58Hm3EtS31XFaagaa8VMReCXAkQnJZ+jEy8PCC/iT18dFy95WcExNHFTqLyp72eQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"
    integrity="sha512-bPs7Ae6pVvhOSiIcyUClR7/q2OAsRiovw4vAkX+zJbw3ShAeeqezq50RIIcIURq7Oa20rW2n2q+fyXBNcU9lrw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
    crossorigin="anonymous"></script>
  <script src="https://kit.fontawesome.com/e5a9c90922.js" crossorigin="anonymous"></script>

  <script>
    // Global variables
    let homeData = null;
    let carousels = [];

    // Initialize the page
    document.addEventListener('DOMContentLoaded', function () {
      loadHomeData();
      handleAuthState();
    });

    // Load home page data
    async function loadHomeData() {
      try {
        showLoading();

        // Replace this with actual API call
        // const response = await fetch('/api/home');
        // const data = await response.json();

        const response = await fetch('http://localhost:3030/home-sections');
        const data = await response.json();

        // Using mock data for demonstration
        // const data = mockApiData;

        if (data.statusCode === 200) {
          homeData = data.items;
          renderContent();
          hideLoading();
        } else {
          throw new Error('API returned error status');
        }
      } catch (error) {
        console.error('Error loading home data:', error);
        showError();
        hideLoading();
      }
    }

    // Show loading spinner
    function showLoading() {
      document.getElementById('loading').classList.remove('d-none');
      document.getElementById('dynamic-content').classList.add('d-none');
      document.getElementById('error-message').classList.add('d-none');
    }

    // Hide loading spinner
    function hideLoading() {
      document.getElementById('loading').classList.add('d-none');
      document.getElementById('dynamic-content').classList.remove('d-none');
    }

    // Show error message
    function showError() {
      document.getElementById('error-message').classList.remove('d-none');
      document.getElementById('loading').classList.add('d-none');
      document.getElementById('dynamic-content').classList.add('d-none');
    }

    // Render all content sections
    function renderContent() {
      const container = document.getElementById('dynamic-content');
      container.innerHTML = '';

      // Sort sections by order
      const sortedSections = homeData.sort((a, b) => a.order - b.order);

      sortedSections.forEach((section, index) => {
        const sectionHtml = renderSection(section, index);
        container.insertAdjacentHTML('beforeend', sectionHtml);
      });

      // Initialize carousels after rendering
      setTimeout(initializeCarousels, 100);
    }

    // Render individual section based on type
    function renderSection(section, index) {
      switch (section.type) {
        case 'banner':
          return renderBannerSection(section, index);
        case 'category_list':
          return renderCategorySection(section);
        case 'gender_shop':
          return renderGenderShopSection(section);
        case 'popular_products':
        case 'featured_coupons':
        case 'deal_list':
        case 'sponsored_list':
          return renderProductSection(section, index);
        case 'game_day':
          return renderGameDaySection(section);
        default:
          return '';
      }
    }

    // Render banner carousel section
    function renderBannerSection(section, index) {
      const carouselId = `carousel-${section.id}`;
      const images = section.metadata.images || [];

      let indicatorsHtml = '';
      let slidesHtml = '';

      images.forEach((image, i) => {
        indicatorsHtml += `
            <button type="button" data-bs-target="#${carouselId}" data-bs-slide-to="${i}" 
                    class="${i === 0 ? 'active' : ''}" aria-current="${i === 0 ? 'true' : 'false'}" 
                    aria-label="Slide ${i + 1}"></button>
          `;

        slidesHtml += `
            <div class="carousel-item ${i === 0 ? 'active' : ''}">
              <img style="cursor: pointer; max-height: 400px; width: 100%; object-fit: contain;" src="${image.url}" class="d-block banner-image" alt="Banner ${i + 1}" />
            </div>
          `;
      });

      return `
          <div class="container">
            <div id="${carouselId}" class="carousel slide dynamic-section" data-bs-ride="carousel">
              <div class="carousel-indicators">
                ${indicatorsHtml}
              </div>
              <div class="carousel-inner">
                ${slidesHtml}
              </div>
              <button style="z-index: 0;" class="carousel-control-prev" type="button" data-bs-target="#${carouselId}" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
              </button>
              <button style="z-index: 0;" class="carousel-control-next" type="button" data-bs-target="#${carouselId}" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
              </button>
            </div>
          </div>
        `;
    }

    // Render category grid section
    function renderCategorySection(section) {
      const categories = section.categories || [];

      let categoriesHtml = '';
      categories.forEach(category => {
        categoriesHtml += `
            <div class="col category-item">
              <a style="color: black;" href="category.html?id=${category.id}&name=${encodeURIComponent(category.name)}" class="text-decoration-none">
                <img style="border-radius: 10px;" src="${category.image.secure_url}" class="category-image" alt="${category.name}" />
                <h6 style="font-size: 12px" class="mt-2 category-name">${category.name}</h6>
              </a>
            </div>
          `;
      });

      return `
          <div class="dynamic-section">
            <div class="container">
              <div class="section-divider">
                <h1>${section.title}</h1>
              </div>
              <div class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-3">
                ${categoriesHtml}
              </div>
            </div>
          </div>
        `;
    }

    // Render gender shop section
    function renderGenderShopSection(section) {
      const genderOptions = section.metadata.genderOptions || [];

      let genderCardsHtml = '';
      genderOptions.forEach(option => {
        genderCardsHtml += `
            <div class="col-md-4">
              <div class="gender-card">
                <img src="${option.image}" alt="${option.label}" />
                <div class="gender-overlay">
                  <h4>${option.label}</h4>
                  <a href="${option.targetUrl}" class="btn btn-light">Shop Now</a>
                </div>
              </div>
            </div>
          `;
      });

      return `
          <div class="dynamic-section">
            <div class="container">
              <div class="section-divider">
                <h1>${section.title}</h1>
              </div>
              <div class="row">
                ${genderCardsHtml}
              </div>
            </div>
          </div>
        `;
    }

    // Render product carousel section
    function renderProductSection(section, index) {
      const products = section.products || [];
      const carouselId = `product-carousel-${index}`;

      let productsHtml = '';
      products.forEach(product => {
        const primaryImage = product.images && product.images.length > 0 ? product.images[0].secure_url : '';
        const discount = product.mrp ? Math.round(((product.mrp - product.price) / product.mrp) * 100) : 0;

        productsHtml += `
            <div class="item p-1">
              <div class="card product-card h-100 ${product.stock > 0 ? '' : 'out-of-stock'}" onclick="openProductDetails('${product.id}')">
                <img src="${primaryImage}" class="card-img-top product-image" alt="${product.name}" />
                <div class="card-body d-flex flex-column">
                  <h6 class="card-title product-name">${product.name}</h6>
                  <p style="font-size: 12px; color: #444; font-weight:600" class="card-text flex-grow-1">${product.brand || "Brand"}</p>
                  <p style="font-size: 12px; color: #666;" class="card-text flex-grow-1 product-description">${product.description}</p>
                  <div class="mt-auto">
                    <div class="d-flex align-items-center">
                      <span class="product-price me-2">₹${product.price}</span>
                      ${+product.mrp > +product.price ? `<span class="product-mrp">₹${product.mrp}</span>` : ''}
                    </div>
                    ${discount > 0 ? `<small class="text-success">${discount}% OFF</small>` : ''}
                    <div class="mt-2">
                       ${product.stock > 0 ?
            `<button style="background-color: #feef02; border-color: black; color: black;" class="btn btn-primary btn-sm w-100" onclick="handleAddToCart(event, '${product.id}')">
                            Add to Cart
                          </button>`
            :
            ` <button class="btn btn-primary btn-sm w-100 out-of-stock-button" onclick="handleAddToCart(event, '${product.id}')">
                            Out of Stock
                          </button>`
          }
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
      });

      return `
          <div class="dynamic-section">
            <div class="container">
              <div class="section-divider">
                <h1>${section.title}</h1>
              </div>
              <div class="owl-carousel owl-theme" id="${carouselId}">
                ${productsHtml}
              </div>
            </div>
          </div>
        `;
    }

    // Render game day section
    function renderGameDaySection(section) {
      const images = section.metadata.images || [];
      const primaryImage = images.length > 0 ? images[0].url : '';

      return `
          <div class="dynamic-section">
            <div class="container">
              <div class="section-divider">
                <h1>${section.title}</h1>
              </div>
              <div style="border: none" class="card">
                <img src="${primaryImage}" class="card-img" alt="Game Day" style="cursor: pointer; max-height: 400px; object-fit: cover;" />
              </div>
            </div>
          </div>
        `;
    }

    // Initialize all carousels
    function initializeCarousels() {
      // Destroy existing carousels
      carousels.forEach(carousel => {
        if (carousel && carousel.destroy) {
          carousel.destroy();
        }
      });
      carousels = [];

      // Initialize Owl Carousels
      $('.owl-carousel').each(function () {
        const carousel = $(this).owlCarousel({
          loop: true,
          margin: 15,
          nav: true,
          dots: false,
          navText: ['<i class="fas fa-chevron-left"></i>', '<i class="fas fa-chevron-right"></i>'],
          responsive: {
            0: {
              items: 1
            },
            600: {
              items: 2
            },
            900: {
              items: 3
            },
            1200: {
              items: 4
            }
          }
        });
        carousels.push(carousel);
      });
    }

    // Add to cart functionality
    function handleAddToCart(event, productId) {
      event.stopPropagation();
      addToCart(productId, 1);
    }

    // Local implementation of addToCart function
    async function addToCart(productId, quantity = 1) {
      const token = localStorage.getItem('token');
      if (!token) {
        showToast('Please login to add items to cart.', 'error');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
        return;
      }
      try {
        const response = await fetch('http://localhost:3030/cart/items', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ productId, quantity })
        });
        const data = await response.json();
        if (response.ok && (data.statusCode === 201 || data.statusCode === 200)) {
          showToast('Product added to cart successfully!', 'success');
        } else if (response.status === 401) {
          showToast('Session expired. Please login again.', 'error');
          setTimeout(() => {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
          }, 1200);
        } else {
          showToast(data.message || 'Failed to add to cart.', 'error');
        }
      } catch (err) {
        showToast('Network error. Please try again.', 'error');
      }
    }

    // // Open product details page
    // function openProductDetails(productId) {
    //   localStorage.setItem('productId', productId);
    //   window.location.href = 'details.html';
    // }

    // Instead of localStorage, use URL parameters
    function openProductDetails(productId) {
      window.location.href = `details.html?id=${productId}`;
    }


    // Handle authentication state
    function handleAuthState() {
      const token = localStorage.getItem("token");
      const signInText = document.querySelector(".signintxt");
      const signInBtn = document.getElementById("inoutbtn");

      if (token && signInText) {
        signInText.innerText = "Logout";

        signInBtn.addEventListener("click", function (event) {
          event.preventDefault();
          localStorage.removeItem("token");
          signInText.innerText = "SignIn";
          signInBtn.href = "signup.html";

          // Show logout success message
          const toast = document.createElement('div');
          toast.className = 'toast position-fixed top-0 end-0 m-3';
          toast.innerHTML = `
              <div class="toast-header">
                <strong class="me-auto">Success</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
              </div>
              <div class="toast-body">
                Logged out successfully!
              </div>
            `;

          document.body.appendChild(toast);
          const bsToast = new bootstrap.Toast(toast);
          bsToast.show();

          toast.addEventListener('hidden.bs.toast', () => {
            toast.remove();
          });
        });
      }
    }

    // Handle responsive navigation
    function toggleMobileMenu() {
      const navbarCollapse = document.getElementById('navbarSupportedContent');
      const bsCollapse = new bootstrap.Collapse(navbarCollapse);
      bsCollapse.toggle();
    }

    // Search functionality
    function handleSearch(event) {
      event.preventDefault();
      const searchInput = document.querySelector('.navbar-search');
      const searchTerm = searchInput.value.trim();

      if (searchTerm) {
        // Implement search logic
        console.log('Searching for:', searchTerm);
        // Redirect to search results page
        // window.location.href = `/category.html?name=${encodeURIComponent(searchTerm)}&quick=false`;
      }
    }

    // Add search event listener
    document.addEventListener('DOMContentLoaded', function () {
      const searchForm = document.querySelector('.d-flex');
      if (searchForm) {
        searchForm.addEventListener('submit', handleSearch);
      }
    });

    // Lazy loading for images
    function lazyLoadImages() {
      const images = document.querySelectorAll('img[data-src]');
      const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            img.src = img.dataset.src;
            img.classList.remove('lazy');
            imageObserver.unobserve(img);
          }
        });
      });

      images.forEach(img => imageObserver.observe(img));
    }

    // Initialize lazy loading
    document.addEventListener('DOMContentLoaded', function () {
      lazyLoadImages();
    });

    // Window resize handler for responsive carousels
    window.addEventListener('resize', function () {
      // Refresh carousels on window resize
      setTimeout(() => {
        $('.owl-carousel').trigger('refresh.owl.carousel');
      }, 100);
    });
  </script>
</body>

</html>
